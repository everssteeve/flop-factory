<!DOCTYPE html>
<html lang="fr">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'self' data:; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist Valise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Checklist Valise</h1>
    <p class="intro">Génère ta liste de valise selon la durée, la saison et le type de séjour. Tes cases restent enregistrées dans ton navigateur.</p>

    <form id="trip-form" class="card" novalidate>
      <div class="field">
        <label for="duration">Durée du séjour (en jours)</label>
        <input id="duration" name="duration" type="number" min="1" max="60" inputmode="numeric" value="3">
      </div>
      <div class="field">
        <label for="season">Saison</label>
        <select id="season" name="season">
          <option value="ete">Été</option>
          <option value="hiver">Hiver</option>
          <option value="mi-saison">Mi-saison</option>
        </select>
      </div>
      <div class="field">
        <label for="trip-type">Type de séjour</label>
        <select id="trip-type" name="tripType">
          <option value="ville">Ville</option>
          <option value="montagne">Montagne</option>
          <option value="plage">Plage</option>
        </select>
      </div>
      <p id="form-error" class="error" role="alert" aria-live="assertive"></p>
      <button id="generate" type="submit" class="btn btn-primary">Générer la liste</button>
    </form>

    <section id="result" class="card" hidden>
      <div class="progress-row">
        <p id="progress" class="progress" aria-live="polite">0 / 0</p>
        <button id="reset" type="button" class="btn btn-secondary">Réinitialiser</button>
      </div>
      <ul id="items" class="items"></ul>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
