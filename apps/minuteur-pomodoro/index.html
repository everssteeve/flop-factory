<!DOCTYPE html>
<html lang="fr">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'self' data:; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minuteur Pomodoro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1 class="app-title">Minuteur Pomodoro</h1>
    <p id="phase" class="phase">Travail</p>
    <p id="timer" class="timer phase-work">25:00</p>
    <div class="controls">
      <button id="start-pause" type="button" class="btn btn-primary">Démarrer</button>
      <button id="reset" type="button" class="btn">Réinitialiser</button>
    </div>
    <p id="counter" class="counter">0 tranche aujourd'hui</p>
    <p class="hint">Tranches de 25 minutes, pause de 5 minutes. Après 4 tranches, pause longue de 15 minutes.</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
