<!doctype html>
<html lang="fr">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'self' data:; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convertisseur de cuisine</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main>
<h1>Convertisseur de cuisine</h1>
<p class="lead">Tasses, cuillères, onces, grammes, ml, températures, et recette ajustée au nombre de personnes.</p>

<section aria-labelledby="t-unit">
<h2 id="t-unit">Unités</h2>
<div class="row">
<label for="unit-value">Valeur</label>
<input id="unit-value" type="text" inputmode="decimal" autocomplete="off" value="1">
<label for="unit-from">De</label>
<select id="unit-from">
<option value="tasse">tasse</option><option value="cs">cuillère à soupe</option><option value="cc">cuillère à café</option><option value="ml">ml</option><option value="oz">once</option><option value="g">g</option>
</select>
<label for="unit-to">Vers</label>
<select id="unit-to">
<option value="ml">ml</option><option value="tasse">tasse</option><option value="cs">cuillère à soupe</option><option value="cc">cuillère à café</option><option value="g">g</option><option value="oz">once</option>
</select>
</div>
<p id="unit-result" class="result" aria-live="polite"></p>
<p id="unit-error" class="error" role="alert"></p>
</section>

<section aria-labelledby="t-temp">
<h2 id="t-temp">Température</h2>
<div class="row">
<label for="temp-value">Valeur</label>
<input id="temp-value" type="text" inputmode="decimal" autocomplete="off" value="180">
<label for="temp-from">Sens</label>
<select id="temp-from"><option value="C">°C vers °F</option><option value="F">°F vers °C</option></select>
</div>
<p id="temp-result" class="result" aria-live="polite"></p>
<p id="temp-error" class="error" role="alert"></p>
</section>

<section aria-labelledby="t-rec">
<h2 id="t-rec">Recette</h2>
<div class="row">
<label for="base-people">Personnes prévues</label>
<input id="base-people" type="number" min="1" step="1" value="4">
<label for="target-people">Personnes cibles</label>
<input id="target-people" type="number" min="1" step="1" value="4">
</div>
<label for="ingredients">Ingrédients (un par ligne : quantité, unité, nom)</label>
<textarea id="ingredients" rows="5">200 g farine
2 tasse lait
1 cc sel</textarea>
<ul id="recipe-result" class="ingredients" aria-live="polite"></ul>
<p id="recipe-error" class="error" role="alert"></p>
</section>
</main>
</body>
</html>
