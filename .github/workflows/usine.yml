name: Usine

# Run quotidien de la phase Socle, sans humain dans la boucle.
#
# Quatre jobs, pour que rien de ce que l'agent écrit ne s'exécute avec un droit :
#   agent    : clé API seule, sandbox OS pour Bash, aucun jeton git. Produit deux
#              artefacts : le site (non fiable) et les enregistrements de coût.
#   gate     : checkout neuf, lecture seule. Valide le site sans croire l'agent.
#   deploy   : publie sur GitHub Pages ce que la porte a validé, puis contrôle.
#   records  : checkout neuf, seul job qui écrit dans le dépôt. Valide puis
#              fusionne le ledger et les journaux.
#
# Secret requis : ANTHROPIC_API_KEY. Prérequis : Settings > Pages > Source = GitHub Actions.

on:
  schedule:
    - cron: "17 5 * * *" # 7h17 à Paris en été, 6h17 en hiver
  workflow_dispatch:

concurrency:
  group: usine
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: "2.1.302"

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      status: ${{ steps.run.outputs.status }}
      leak: ${{ steps.leak.outputs.leak }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Le ledger vit sur la branche data : on y lit les dépenses du jour.
      - name: Charger le ledger
        run: |
          if git fetch --depth 1 origin data 2>/dev/null; then
            git checkout FETCH_HEAD -- factory/ledger factory/runs 2>/dev/null || true
          fi

      - name: Arrêt d'urgence
        id: stop
        run: |
          if [ -f STOP ]; then
            echo "Fichier STOP présent : aucun run aujourd'hui."
            echo "stopped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sandbox, Claude Code et plugin
        if: steps.stop.outputs.stopped != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          # Ubuntu 24.04 : bubblewrap a besoin des espaces de noms utilisateur.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
          node scripts/build-plugin.mjs
          echo "WORK=$RUNNER_TEMP/ff-work" >> "$GITHUB_ENV"
          echo "RECORDS=$RUNNER_TEMP/ff-records" >> "$GITHUB_ENV"

      - name: Vérifier que les garde-fous sont actifs
        if: steps.stop.outputs.stopped != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/guard-smoke.mjs "$WORK/guard-smoke" "$RECORDS"

      - name: Atelier Build — app de test
        id: run
        if: steps.stop.outputs.stopped != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/run-atelier.mjs --atelier build --prompt factory/prompts/socle-hello.md \
            --workdir "$WORK/hello" --records "$RECORDS"

      - name: Arrêter les processus laissés par l'agent
        if: always() && steps.stop.outputs.stopped != 'true'
        run: pkill -f -- "$WORK" || true

      - name: Recherche de fuite de la clé
        id: leak
        if: steps.run.outputs.status == 'ok'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if node scripts/leak-check.mjs "$WORK/hello"; then echo "leak=none" >> "$GITHUB_OUTPUT"; else echo "leak=found" >> "$GITHUB_OUTPUT"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: steps.leak.outputs.leak == 'none'
        with:
          name: site
          path: |
            ${{ runner.temp }}/ff-work/hello/index.html
            ${{ runner.temp }}/ff-work/hello/style.css
            ${{ runner.temp }}/ff-work/hello/test.mjs
            ${{ runner.temp }}/ff-work/hello/report.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always() && steps.stop.outputs.stopped != 'true'
        with:
          name: records
          path: ${{ runner.temp }}/ff-records
          if-no-files-found: ignore
          retention-days: 30

  gate:
    needs: agent
    if: needs.agent.outputs.status == 'ok' && needs.agent.outputs.leak == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site
      # La porte est exécutée par le workflow : un rapport « ok » de l'agent ne suffit jamais.
      - name: Porte qualité
        run: node scripts/quality-gate.mjs "$RUNNER_TEMP/site"
      - name: Préparer la publication
        run: |
          mkdir -p "$RUNNER_TEMP/public"
          cp "$RUNNER_TEMP/site/index.html" "$RUNNER_TEMP/site/style.css" "$RUNNER_TEMP/public/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/public

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
      - name: Contrôle en ligne
        env:
          URL: ${{ steps.pages.outputs.page_url }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL" | grep -q "<title>"; then echo "En ligne : $URL"; exit 0; fi
            sleep 10
          done
          echo "La page publiée ne répond pas correctement." >&2
          exit 1

  records:
    needs: agent
    if: always() && needs.agent.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: records
          path: ${{ runner.temp }}/records
      # main est protégée (PR + revue) : les données de l'usine vont sur la
      # branche data, que le bot peut écrire sans toucher au code ni aux garde-fous.
      - name: Ouvrir la branche data
        run: |
          DATA="$RUNNER_TEMP/data"
          if git fetch origin data 2>/dev/null; then
            git worktree add -B data "$DATA" FETCH_HEAD
            rm -rf factory/ledger factory/runs
            mkdir -p factory/ledger factory/runs
            cp -a "$DATA/factory/ledger/." factory/ledger/ 2>/dev/null || true
            cp -a "$DATA/factory/runs/." factory/runs/ 2>/dev/null || true
          else
            git worktree add --orphan -b data "$DATA"
          fi
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Valider et fusionner
        run: node scripts/merge-records.mjs "$RUNNER_TEMP/records"
      - name: Commiter sur data
        run: |
          mkdir -p "$DATA/factory"
          rm -rf "$DATA/factory/ledger" "$DATA/factory/runs"
          cp -a factory/ledger factory/runs "$DATA/factory/"
          cd "$DATA"
          git config user.name "flop-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add factory/ledger factory/runs
          if git diff --cached --quiet; then echo "rien à commiter"; exit 0; fi
          git commit -m "usine: ledger et journaux du $(TZ=Europe/Paris date +%F)"
          git push origin HEAD:data
